# 部署 aibox-site → Cloudflare Pages（GitHub Actions 出站，仓库零凭据）
# 触发链（数据流三层）：
#   1) push main           → 重建部署
#   2) repository_dispatch registry-updated → registry 仓 push 后触发重建（I1 拉最新数据）
#   3) schedule 每日一次    → 兜底重建（Pages 构建 500/月配额：日 1 次 ≈30/月，安全）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [registry-updated]
  schedule:
    # UTC 03:47 每日一次（避开整点高峰）；配额见上
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本取自 package.json packageManager 字段（不在此重复声明）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 构建时拉 registry（I1）；registry 不可用时自动降级占位数据，构建不炸
      - name: Build
        run: pnpm build

      # 直传 dist（不绑域名，只用 pages.dev；域名后续接管）
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.62.0 pages deploy dist --project-name=aibox-site --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # 质量门禁：双语缺页扫描 + Lighthouse 桌面性能/无障碍/SEO 断言
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sanitization scan (full history)
        run: node scripts/prepush-scan.mjs --history

      - name: Check zh/en route parity
        run: node scripts/check-routes.mjs

      - name: MCP endpoint unit tests (node --test)
        run: node --test functions/mcp.test.mjs functions/_lib/stats.test.mjs

      - name: Lighthouse (desktop, assertions in lighthouserc.json)
        run: pnpm exec lhci autorun
